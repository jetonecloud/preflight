[project]
name = "preflight-cli"
version = "0.1.0"
description = "Free, open-source, read-only AWS audit CLI. Find the first three things to fix in deploys, cost, and bus factor."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Jet1", email = "hello@jetonecloud.com" }]
keywords = ["aws", "audit", "devops", "cost-optimization", "security"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  # Imported directly for prompt/abort handling, and we rely on the separated
  # stdout/stderr streams in CliRunner that 8.2 introduced.
  "click>=8.2",
  "boto3>=1.34",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/jetonecloud/preflight"
Issues = "https://github.com/jetonecloud/preflight/issues"
Security = "https://github.com/jetonecloud/preflight/blob/main/SECURITY.md"

[project.scripts]
preflight = "preflight.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "moto[all]>=5.0",
  "ruff>=0.6",
  # Used by the tests to parse the generated CloudFormation template.
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
