name: Release

# Tag a commit on main to cut a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Nothing ships unless CI passes and the tag matches preflight.__version__.
# Assets are named without a version, so the installer can always fetch
# .../releases/latest/download/preflight-<platform> without calling the API.

on:
  push:
    tags: ["v*"]
  # Dry run: builds and smoke-tests the binaries, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tag must match the packaged version
        # Both places: __version__ is what the binary reports, the project
        # metadata is what PyPI publishes. A release where they disagree
        # ships a binary that misreports itself.
        run: |
          set -eu
          uv sync --all-extras --dev
          tag="${GITHUB_REF_NAME#v}"
          attr=$(uv run python -c 'import preflight; print(preflight.__version__)')
          meta=$(uv run python -c 'from importlib.metadata import version; print(version("preflight-cli"))')
          echo "tag=$tag  __version__=$attr  metadata=$meta"
          if [ "$tag" != "$attr" ] || [ "$tag" != "$meta" ]; then
            echo "::error::tag v$tag doesn't match the package ($attr / $meta)."
            echo "Bump src/preflight/__init__.py and pyproject.toml together, or retag."
            exit 1
          fi
          echo "v$tag matches the package. OK."

  build:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        # Oldest available image per platform: a binary built against an older
        # glibc/macOS SDK runs on newer systems, but not the other way round.
        # macos-15-intel is the Intel runner now that macos-13 is retired.
        include:
          - { os: ubuntu-22.04, target: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: linux-aarch64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: macos-14, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the project and PyInstaller
        run: |
          uv sync --all-extras --dev
          uv pip install pyinstaller

      - name: Build a single-file binary
        # --add-data is load-bearing twice over: core/cfn.py reads the
        # CloudFormation template and core/brand.py reads the Jet1 mark that
        # goes in the PDF, both through importlib.resources, which finds
        # nothing in a frozen bundle unless the file is copied in alongside
        # the package.
        #
        # boto3 needs no flags here. Nothing imports it yet, so it isn't
        # bundled at all; once the checks do, PyInstaller's bundled
        # boto3/botocore hooks collect the service data on their own. The
        # smoke test below is what proves that, build by build.
        run: |
          uv run pyinstaller \
            --onefile \
            --name preflight \
            --paths src \
            --add-data "src/preflight/templates/role.cfn.yaml.j2:preflight/templates" \
            --add-data "src/preflight/assets/jet1-mark.png:preflight/assets" \
            src/preflight/cli.py

      - name: Smoke-test the binary
        # Catches a missing template, a missing logo, a missing boto3 data
        # file, and a binary that can't start at all — none of which the
        # test suite can see.
        run: |
          set -eu
          ./dist/preflight --help > /dev/null
          ./dist/preflight scan --list-modules
          ./dist/preflight scan -m cost --print | grep -q "AWSTemplateFormatVersion"
          ./dist/preflight scan -m cost --services ec2 --print | grep -q "ec2:DescribeVolumes"
          ./dist/preflight scan -m cost --out "$RUNNER_TEMP/role.yaml"
          grep -q "PreflightReadOnlyRole" "$RUNNER_TEMP/role.yaml"
          ./dist/preflight demo --pdf --no-json --out "$RUNNER_TEMP/report"
          head -c 4 "$RUNNER_TEMP/report"/preflight-report-*.pdf | grep -q "%PDF"
          echo "binary works on ${{ matrix.target }}"

      - name: Name the asset after its platform
        run: mv dist/preflight "preflight-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ matrix.target }}
          path: preflight-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [build, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC, for build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: preflight-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          chmod +x preflight-*
          sha256sum preflight-* > checksums.txt
          cat checksums.txt

      - name: Attest what built these binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/preflight-*

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/preflight-*
            dist/checksums.txt
            install.sh
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-docker:
    # Makes `docker run ghcr.io/jetonecloud/preflight` real. No secret to
    # set: GHCR takes the workflow's own token. The package it creates is
    # private until somebody makes it public once, by hand — see
    # docs/release.md.
    #
    # Built from the wheel, not the PyInstaller binaries, so it doesn't need
    # them — but it waits for them anyway, because half a release is worse
    # than a late one.
    needs: [build, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC, for build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.2.0 publishes 0.2.0, 0.2 and latest. A prerelease tag
          # (v0.3.0-rc1) publishes itself and leaves latest where it is.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest what built this image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-homebrew:
    # Makes `brew install jetonecloud/tap/preflight` real, by committing a
    # rendered formula to the tap repository.
    #
    # Switched on by two repository settings, because the tap is a different
    # repo and the workflow's own token can't write to it:
    #
    #   variable HOMEBREW_TAP        e.g. jetonecloud/homebrew-tap
    #   secret   HOMEBREW_TAP_TOKEN  a token with contents:write on that repo
    #
    # With the variable unset, the release skips this job rather than failing
    # it — the tap is optional, the release isn't. (The `if` tests the
    # variable rather than the secret because secrets aren't available in a
    # job-level condition.)
    #
    # Waits for `publish`: a formula is a URL plus a checksum, so pushing it
    # before the assets exist would hand everyone a 404.
    needs: [publish]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.HOMEBREW_TAP != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: preflight-*
          merge-multiple: true

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render the formula
        # The checksums come from the same artifacts `publish` uploaded, so
        # the formula and checksums.txt can't disagree about what shipped.
        run: |
          set -eu
          cd dist
          sha256sum preflight-* > checksums.txt
          cd ..
          mkdir -p tap/Formula
          sh packaging/homebrew/render-formula.sh \
            "${GITHUB_REF_NAME}" dist/checksums.txt > tap/Formula/preflight.rb
          cat tap/Formula/preflight.rb

      - name: Commit it to the tap
        run: |
          set -eu
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/preflight.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula. Nothing to do."
            exit 0
          fi
          git commit -m "preflight ${GITHUB_REF_NAME#v}"
          git push

  publish-pypi:
    # Makes `pipx install preflight-cli` and `uv tool install preflight-cli`
    # real. Needs a PyPI trusted publisher for this repo + workflow; delete
    # this job if you'd rather not publish to PyPI yet.
    needs: [build, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC, so there's no API token to store
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
