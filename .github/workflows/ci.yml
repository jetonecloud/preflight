name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release reuses these jobs, so a tag can't ship something that doesn't pass.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  install-script:
    # The installer is what most people will actually run, so hold it to the
    # same bar as the Python: POSIX sh only, no shellcheck warnings. The
    # formula renderer gets the same treatment — it runs on a release, where
    # a shell bug is expensive and nobody is watching.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh install.sh packaging/homebrew/render-formula.sh
      - run: sh -n install.sh
      - run: sh -n packaging/homebrew/render-formula.sh

  docker:
    # The image is published on release, so a Dockerfile that stopped
    # building would otherwise be discovered at the worst possible moment.
    # One architecture here, both of them on release: this is about whether
    # the thing builds and runs, not about QEMU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: preflight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # The same bar as the binary's smoke test: it starts, it runs the
        # real checks, and it writes a PDF. Plus the two things that are
        # specific to a container — that it isn't root, and that the
        # documented bind mount lands files on the host.
        run: |
          set -eu
          docker run --rm preflight:ci --version
          docker run --rm --entrypoint id preflight:ci -un | grep -qx preflight
          docker run --rm --entrypoint sh preflight:ci -c \
            'preflight demo --pdf --no-json && head -c 4 /out/preflight-report-*.pdf' \
            | grep -q "%PDF"
          mkdir -p "$RUNNER_TEMP/out"
          chmod 777 "$RUNNER_TEMP/out"
          docker run --rm -v "$RUNNER_TEMP/out:/out" preflight:ci demo --pdf
          ls "$RUNNER_TEMP/out"/preflight-report-*.pdf
          ls "$RUNNER_TEMP/out"/preflight-report-*.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every version `requires-python` allows. A `pipx install` on 3.14
        # shouldn't be the first time anyone runs the suite there.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run pytest --cov --cov-report=term-missing

  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify IAM policy contains no write/wildcard actions
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("iam/policy.json") as f:
              policy = json.load(f)
          allowed_prefixes = ("Get", "List", "Describe")
          # Read-only actions that don't follow Get/List/Describe naming but
          # perform no mutation. Keep in sync with tests/test_policy.py.
          exceptions = {"cloudtrail:LookupEvents"}
          bad = []
          for stmt in policy.get("Statement", []):
              actions = stmt.get("Action", [])
              if isinstance(actions, str):
                  actions = [actions]
              for action in actions:
                  if action == "*" or ":" not in action:
                      bad.append(action)
                      continue
                  if action in exceptions:
                      continue
                  verb = action.split(":", 1)[1]
                  if not verb.startswith(allowed_prefixes) or verb == "*":
                      bad.append(action)
          if bad:
              print("Non-read-only actions found in iam/policy.json:", bad)
              sys.exit(1)
          print("iam/policy.json is read-only. OK.")
          EOF
