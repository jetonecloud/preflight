AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Dedicated read-only IAM role for Jet1 Preflight. Creates a role that can be
  assumed (optionally cross-account) with only the permissions in
  iam/policy.json — no write or wildcard actions. Safe to deploy once and
  reuse for every Preflight scan.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: >
      ARN of the IAM user/role that will assume this role to run Preflight.
      Use your own account's user/role ARN for same-account use, or an
      external account's ARN only if you intend cross-account access.
  ExternalId:
    Type: String
    Default: ""
    Description: >
      Optional external ID to require on AssumeRole, recommended for
      cross-account trust relationships.
    NoEcho: true

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]

Resources:
  PreflightReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: PreflightReadOnlyPolicy
      Description: Read-only permissions used by Jet1 Preflight. Get*/List*/Describe* only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PreflightReadOnly
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - iam:GetAccountSummary
              - iam:ListUsers
              - iam:ListAccessKeys
              - iam:GetAccessKeyLastUsed
              - iam:ListMFADevices
              - iam:ListRoles
              - iam:ListPolicies
              - iam:GetAccountPasswordPolicy
              - ec2:DescribeInstances
              - ec2:DescribeVolumes
              - ec2:DescribeAddresses
              - ec2:DescribeSnapshots
              - ec2:DescribeSecurityGroups
              - ec2:DescribeNatGateways
              - ec2:DescribeImages
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeRegions
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
              - autoscaling:DescribeAutoScalingGroups
              - rds:DescribeDBInstances
              - rds:DescribeDBSnapshots
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
              - s3:GetBucketPolicyStatus
              - s3:GetBucketPublicAccessBlock
              - s3:GetEncryptionConfiguration
              - s3:GetBucketTagging
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
              - cloudtrail:LookupEvents
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackDriftDetectionStatus
              - cloudformation:DescribeStackResourceDrifts
              - cloudformation:ListStacks
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:ListClusters
              - ecs:ListServices
              - ecr:DescribeRepositories
              - ecr:DescribeImages
              - codedeploy:ListApplications
              - codedeploy:GetDeploymentConfig
              - cloudwatch:GetMetricStatistics
              - cloudwatch:DescribeAlarms
              - logs:DescribeLogGroups
              - sns:ListSubscriptions
              - sns:ListTopics
              - ce:GetCostAndUsage
              - pricing:GetProducts
              - tag:GetResources
            Resource: "*"

  PreflightReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PreflightReadOnlyRole
      Description: Role assumed by Jet1 Preflight to run a read-only AWS audit.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref ExternalId
              - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Ref PreflightReadOnlyPolicy

Outputs:
  RoleArn:
    Description: ARN to pass to `preflight scan --role-arn`
    Value: !GetAtt PreflightReadOnlyRole.Arn
